        - asset: assets/fonts/Noto_Sans_Devanagari,Nunito/Nunito/static/Nunito-Light.ttf
          weight: 300
        - asset: assets/fonts/Noto_Sans_Devanagari,Nunito/Nunito/static/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Noto_Sans_Devanagari,Nunito/Nunito/static/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Noto_Sans_Devanagari,Nunito/Nunito/static/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Noto_Sans_Devanagari,Nunito/Nunito/static/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Noto_Sans_Devanagari,Nunito/Nunito/static/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Noto_Sans_Devanagari,Nunito/Nunito/static/Nunito-Black.ttf
