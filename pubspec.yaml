name: internship_task
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5+1
  flutter_screenutil: ^5.9.3


  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
      - assets/

  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Noto_Sans_Devanagari,Nunito/Nunito/static/Nunito-ExtraLight.ttf
