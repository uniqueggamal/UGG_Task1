          weight: 500
        - asset: assets/fonts/Noto_Sans_Devanagari,Nunito/Noto_Sans_Devanagari/static/NotoSansDevanagari-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Noto_Sans_Devanagari,Nunito/Noto_Sans_Devanagari/static/NotoSansDevanagari-Bold.ttf
